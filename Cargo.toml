[workspace]
members = [
    "packages/accesskit_xplat",
    "packages/debug_timer",
    "packages/blitz-traits",
    "packages/blitz-dom",
    "packages/blitz-dom-api",
    "packages/blitz-platform-api",
    "packages/dom-abi",
    "packages/blitz-wasm",
    "packages/blitz-html",
    "packages/blitz-script",
    "packages/blitz-net",
    "packages/blitz-paint",
    "packages/blitz-shell",
    "packages/blitz",
    "packages/stylo_taffy",
    "packages/dioxus-native",
    "packages/dioxus-native-dom",
    "packages/blitz-test-harness",
    "apps/browser",
    "apps/browser/persistence",
    "apps/readme",
    "apps/bump",
    "wpt/runner",
    "tests/blitz-tests",
    "examples/counter",
    "examples/transparent",
    "examples/seven_guis",
    "examples/todomvc",
    "examples/wgpu_texture",
    "examples/wasm_hello",
]
# `packages/blitz-wasm/guest` is a SEPARATE workspace, deliberately. It builds
# for wasm32-unknown-unknown and has its own target directory, so
# `cargo test -p blitz-wasm` can shell out to build it without deadlocking on
# this workspace's own target lock. See packages/blitz-wasm/ABI.md.
exclude = ["sites", "packages/blitz-wasm/guest"]
resolver = "2"

[workspace.package]
version = "0.4.2"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/pathscale/ps-blitz"
repository = "https://github.com/pathscale/ps-blitz"
categories = ["gui"]
edition = "2024"
rust-version = "1.89.0"

[workspace.dependencies]
# Blitz dependencies(in-repo)
blitz = { package = "ps-blitz", version = "^0.4.0", path = "./packages/blitz" }
blitz-dom = { package = "ps-blitz-dom", version = "^0.4.0", path = "./packages/blitz-dom", default-features = false }
blitz-html = { package = "ps-blitz-html", version = "^0.4.0", path = "./packages/blitz-html", default-features = false }
blitz-script = { package = "ps-blitz-script", version = "^0.4.0", path = "./packages/blitz-script", default-features = false }
blitz-net = { package = "ps-blitz-net", version = "^0.4.0", path = "./packages/blitz-net", default-features = false }
blitz-paint = { package = "ps-blitz-paint", version = "^0.4.0", path = "./packages/blitz-paint", default-features = false }
blitz-shell = { package = "ps-blitz-shell", version = "^0.4.0", path = "./packages/blitz-shell", default-features = false }
blitz-traits = { package = "ps-blitz-traits", version = "^0.4.0", path = "./packages/blitz-traits", default-features = false }
stylo_taffy = { package = "ps-stylo-taffy", version = "^0.4.0", path = "./packages/stylo_taffy", default-features = false }
dioxus-native = { package = "ps-dioxus-native", version = "^0.7.3", path = "./packages/dioxus-native", default-features = false }
dioxus-native-dom = { package = "ps-dioxus-native-dom", version = "^0.7.3", path = "./packages/dioxus-native-dom", default-features = false }
# 0.1.3, because `packages/debug_timer` is 0.1.3 and this asked for 0.1.2.
#
# A path dependency ignores the mismatch, so nothing here noticed. A *published*
# crate does not: `ps-blitz-dom 0.3.0-beta.6` went out carrying
# `ps-debug-timer ^0.1.2`, no such version exists on the registry, and cargo
# resolved the unrelated upstream `debug_timer 0.1.3` that happens to share the
# name once the `package =` rename is dropped. That crate has neither
# `log_line` nor `RealDebugTimer::init_if`, so every consumer of the published
# blitz-dom fails to compile:
#
#     error[E0425]: cannot find function `log_line` in crate `debug_timer`
#     error[E0599]: no associated function named `init_if` found for `RealDebugTimer`
#
# A caret keeps this in step with the crate it points at, the way the rest of
# this table now does.
#
# 0.1.4 is a floor, not just a bump. The 0.1.3 tarball on crates.io predates
# `init_if`, `is_logging` and the `write_line as log_line` re-export: the code
# gained them without a version change, so the registry kept serving the older
# one under a number that already existed. `^0.1.3` therefore *permitted* the
# broken tarball, and a consumer that resolved it hit the same two errors above
# for a third time. Asking for 0.1.4 makes the version say which API is meant.
debug_timer = { package = "ps-debug-timer", version = "^0.1.4", path = "./packages/debug_timer" }
accesskit_xplat = { package = "ps-accesskit-xplat", version = "^0.1.1", path = "./packages/accesskit_xplat", default-features = false }
browser-persistence = { path = "./apps/browser/persistence" }
blitz-test-harness = { path = "./packages/blitz-test-harness" }
blitz-dom-api = { package = "ps-blitz-dom-api", version = "^0.4.0", path = "./packages/blitz-dom-api" }
# Published to crates.io on its own 0.1 line, unlike everything else here,
# which tracks the workspace version. The `version` is what makes a
# consumer outside this repo resolvable, and it is what caught the copy
# that had drifted to `publish = false` and a workspace version.
dom-abi = { version = "^0.1.1", path = "./packages/dom-abi" }
blitz-platform-api = { package = "ps-blitz-platform-api", version = "^0.4.0", path = "./packages/blitz-platform-api" }

# Servo dependencies
style = { version = "^0.20.0", package = "stylo" }
style_traits = { version = "^0.20.0", package = "stylo_traits" }
style_atoms = { version = "^0.20.0", package = "stylo_atoms" }
style_config = { version = "^0.20.0", package = "stylo_static_prefs" }
style_dom = { version = "^0.20.0", package = "stylo_dom" }
selectors = { version = "^0.40.0", package = "selectors" }
boa_engine = { package = "ps-boa-engine", version = "^1.0.3" }
boa_runtime = { package = "ps-boa-runtime", version = "^1.0.3" }
boa_gc = { package = "ps-boa-gc", version = "^1.0.3" }
base64 = "^0.22"
blitz-debug-control = { package = "ps-blitz-debug-control", version = "^0.3.5" }
getrandom = "^0.4"
serde_json = "^1"
cssparser = { version = "^0.37.0" }

# HTML5ever dependencies
markup5ever = "^0.39.0" # needs to match stylo web_atoms version
html5ever = "^0.39.0"   # needs to match stylo web_atoms version
xml5ever = "^0.39.0"    # needs to match stylo web_atoms version
# Already in the graph under stylo and markup5ever, which is what `QualName` is
# built from; named directly so attribute *values* can be interned too. Has to
# resolve to the same version those pull, or an `Atom` handed between them is a
# different type and will not compile.
string_cache = "^0.9.0"

# Other Servo dependencies
euclid = "^0.22"
atomic_refcell = "^0.1.13"
app_units = "^0.7.5"
smallvec = "^1"
thin-vec = "^0.2"

# DioxusLabs dependencies
dioxus = { version = "^0.7.3" }
dioxus-core = { version = "^0.7.3" }
dioxus-html = { version = "^0.7.3" }
dioxus-hooks = { version = "^0.7.3" }
dioxus-signals = { version = "^0.7.3" }
dioxus-stores = { version = "^0.7.3" }
dioxus-asset-resolver = { version = "^0.7.3" }
manganis = { version = "^0.7.3" }
dioxus-document = { version = "^0.7.3" }
dioxus-history = { version = "^0.7.3" }

# Dioxus hot reload
dioxus-devtools = { version = "^0.7.3" }
dioxus-cli-config = { version = "^0.7.3" }

# Dioxus Prelude
dioxus-core-macro = { version = "^0.7.3" }

# Taffy + Parley + Fontations
taffy = { package = "ps-taffy", version = "^0.13.0", default-features = false, features = [
    "std",
    "flexbox",
    "grid",
    "block_layout",
    "content_size",
    "calc",
    "detailed_layout_info",
] }
parley = { version = "^0.10", default-features = false, features = ["std"] }
skrifa = { version = "^0.42", default-features = false, features = [
    "std",
] } # Should match parley and vello versions

# AnyRender
#
# By version, not by revision. A `rev` here has to be bumped by hand for every
# anyrender release, and then bumped again in every consumer that pins this
# repository, because a git dependency is not a version and cargo cannot pick a
# compatible one. That is two manual edits per release to say nothing more than
# "take the current anyrender", and the pins drift the moment one of them is
# forgotten: this repository sat on f1c53ba while anyrender moved four commits
# and two minor versions past it.
#
# A caret says the thing that is actually meant. `cargo update -p ps-anyrender`
# moves it, `Cargo.lock` records what was resolved, and a consumer taking this
# repository gets the same range rather than a second copy of anyrender pinned
# somewhere else in the graph.
anyrender = { package = "ps-anyrender", version = "^0.13.0" }
anyrender_serialize = { version = "^0.6.0" }
anyrender_skia = { version = "^0.10.0" }
anyrender_vello = { package = "ps-anyrender-vello", version = "^0.14.0" }
anyrender_vello_cpu = { package = "ps-anyrender-vello-cpu", version = "^0.17.0" }
anyrender_vello_hybrid = { package = "ps-anyrender-vello-hybrid", version = "^0.10.0" }
anyrender_svg = { package = "ps-anyrender-svg", version = "^0.15.0" }
wgpu_context = { version = "^0.8.0" }

# Linebender + Fontations + WGPU + SVG
color = "^0.3"
linebender_resource_handle = "^0.1"
peniko = "^0.6.0"
kurbo = "^0.13.1"
wgpu = "^29"
# `ps-usvg`, not `usvg`: this graph needs `pub use svgtypes` and
# `Tree::intrinsic_dimensions`, neither of which is on a published linebender
# usvg. That used to be a `[patch.crates-io]` pointing at a resvg branch, which
# builds but cannot publish - cargo ignores `[patch]` when packaging, so
# `ps-blitz-dom` verified against the registry's usvg and failed with
# `unresolved import usvg::svgtypes`, blocking the whole engine from crates.io.
# The fork is published under its own name now, so this is an ordinary version.
usvg = { package = "ps-usvg", version = "^0.48.1" }

# Windowing & Input
raw-window-handle = "^0.6.0"
winit = { version = "0.31.0-beta.2" }
accesskit = "^0.24"
arboard = { version = "^3.4.1", default-features = false }
rfd = { version = "^0.17.1", default-features = false }
keyboard-types = "^0.7"
cursor-icon = "^1"

# IO & Networking
url = "^2.5.0"
http = "^1.1.0"
data-url = "^0.3.1"
tokio = "^1.42"
reqwest = { version = "^0.13", default-features = false }
reqwest-middleware = { version = "^0.5.1", default-features = false }
http-cache-reqwest = { version = "1.0.0-alpha.6", default-features = false, features = ["reqwest-middleware"] }
http-cache = { version = "1.0.0-alpha.6", default-features = false }

# Media & Decoding
image = { version = "^0.25.6", default-features = false }
wuff = "^0.2"
html-escape = "^0.2.13"
percent-encoding = "^2.3.1"
png = "^0.18"
serde = "^1"

# Dioxus Native
webbrowser = "^1.0"
directories = "^6.0.0"

# WASM
wasm-bindgen = "^0.2"
wasm-bindgen-futures = "^0.4"
tracing-wasm = "^0.2.1"
web-sys = "^0.3.98"
web-time = "^1"
console_error_panic_hook = "^0.1"

# Other dependencies
rustc-hash = "^2.1.2"
bytes = "^1.7.1"
slotmap = "^1.0.7"
tracing = "^0.1.40"
tracing-subscriber = "^0.3"
futures-util = "^0.3.30"
futures-intrusive = "^0.5.0"
pollster = "^0.4"
smol_str = "^0.3"
bitflags = "^2.8.0"
bytemuck = "^1"
rayon = "^1"
thread_local = "^1"

[profile.profile]
inherits = "release"
debug = true

[profile.production]
inherits = "release"
opt-level = 3
debug = false
lto = true
codegen-units = 1
strip = true
incremental = false

[profile.p2]
inherits = "production"
opt-level = 2

[profile.small]
inherits = "production"
opt-level = "s"
panic = "abort"

[profile.small-panic]
inherits = "small"
panic = "unwind"

[profile.tiny]
inherits = "small"
opt-level = "z"

[profile.tiny.package.fearless_simd]
opt-level = 3
[profile.tiny.package.vello_cpu]
opt-level = 3
[profile.tiny.package.ps-taffy]
opt-level = 3
[profile.tiny.package.harfrust]
opt-level = 3
[profile.tiny.package.skrifa]
opt-level = 3

# This is a "virtual package"
# It is not meant to be published, but is used so "cargo run --example XYZ" works properly
[package]
name = "blitz-examples"
version = "0.0.1"
authors = ["Jonathan Kelley"]
edition = "2024"
description = "Top level crate for Blitz"
license = "MIT OR Apache-2.0"
keywords = ["dom", "ui", "gui", "react", "wasm"]
rust-version = "1.89.0"
publish = false

[features]
log-times = ["log-frame-times", "log-phase-times"]
log-frame-times = ["dioxus-native/log-frame-times"]
log-phase-times = ["dioxus-native/log-phase-times"]

[dev-dependencies]
blitz-script = { workspace = true }
url = { workspace = true }
anyrender = { workspace = true }
anyrender_vello = { workspace = true }
anyrender_vello_cpu = { workspace = true, features = ["multithreading"] }
anyrender_vello_hybrid = { workspace = true }
blitz-dom = { workspace = true, features = ["default"] }
blitz-html = { workspace = true }
blitz-traits = { workspace = true }
blitz-paint = { workspace = true }
blitz-shell = { workspace = true }
blitz-net = { workspace = true }
blitz = { workspace = true, features = ["net"] }
dioxus = { workspace = true }
dioxus-native = { workspace = true, features = [
    "vello-hybrid",
    "floats",
    "svg",
    "prelude",
] }
euclid = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
image = { workspace = true }
png = { workspace = true }
peniko = { workspace = true }
color = { workspace = true }
env_logger = "0.11"
tracing-subscriber = "0.3"

# Local Boa, until `JsObject::downgrade` is published.
#
# The DOM wrapper caches have to hold weak handles. A strong cache pins every
# node script has ever touched, which is why a removed node could never be
# freed: `createElement` caches a wrapper for all of them, so everything looked
# reachable for ever.
