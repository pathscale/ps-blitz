[package]
name = "blitz-net"
description = "Blitz networking"
documentation = "https://docs.rs/blitz-net"
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
http2 = ["reqwest/http2"]
# Transparent Content-Encoding handling. Without these reqwest hands back the
# raw compressed bytes, so a server answering `content-encoding: br` yields an
# unparseable page, an unparseable stylesheet, and a script that fails on its
# first byte. Servers may compress regardless of Accept-Encoding, so this is
# not optional in practice.
compression = ["reqwest/brotli", "reqwest/gzip", "reqwest/deflate", "reqwest/zstd"]
cookies = ["reqwest/cookies"]
multipart = ["reqwest/multipart", "reqwest/stream"]
cache = ["dep:reqwest-middleware", "dep:http-cache-reqwest", "dep:directories", "dep:http-cache"]
tracing = ["dep:tracing"]

[dependencies]
# Blitz dependencies
blitz-traits = { workspace = true }

# Networking dependencies
tokio = { workspace = true, features = ["sync", "time"] }
reqwest = { workspace = true, features = ["charset", "native-tls", "form"] }
data-url = { workspace = true }

# Caching
reqwest-middleware = { workspace = true, optional = true, features = ["form"]}
http-cache-reqwest = { workspace = true, optional = true, features = ["manager-cacache"] }
http-cache = { workspace = true, optional = true, features = ["url-standard"] }
directories = { workspace = true, optional = true }

tracing = { workspace = true, optional = true }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { workspace = true, features = ["native-tls-vendored"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { workspace = true }
