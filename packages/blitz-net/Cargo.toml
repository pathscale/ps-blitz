[package]
# Published as `ps-*` because `blitz-net` on crates.io is DioxusLabs', and this
# is a fork. Keeping the upstream name meant this crate could not be published
# at all, and worse, that a dependent asking for `blitz-net` by version would
# silently get upstream's. The `[lib]` name below stays `blitz_net`, so every
# path in this workspace is unchanged.
name = "ps-blitz-net"
description = "Blitz networking"
documentation = "https://docs.rs/ps-blitz-net"
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "blitz_net"

[features]
# Reserved until the house HTTP/2 transport lands. HTTP/1.1 remains available.
http2 = []
# Enables the embedder-owned house CookieJar constructor.
cookies = []
# Advertise only the codecs decoded by the house HTTP client.
compression = ["dep:flate2", "dep:brotli"]
multipart = ["dep:psc-nanoid"]
cache = [
    "dep:worktable",
    "dep:psc-nanoid",
    "dep:httpdate",
]
tracing = ["dep:tracing"]

[dependencies]
# Blitz dependencies
blitz-traits = { workspace = true }

# Networking dependencies
data-url = { workspace = true }
bytes = { workspace = true }
url = { workspace = true }

# NET-H1 codecs, matching chuzz.
flate2 = { version = "1", optional = true }
brotli = { version = "8", default-features = false, features = ["std"], optional = true }

tracing = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nagoya = { version = "^0.1.13", features = ["reactor"] }
nago-rustls = { version = "^0.1.1", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
rustls-platform-verifier = "^0.6.2"
# Required for durable metadata, house body identifiers and RFC HTTP dates.
worktable = { version = "^1.10.0-beta2", default-features = false, features = ["std", "wti-std-search"], optional = true }
psc-nanoid = { version = "^3.2", optional = true }
httpdate = { version = "^1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { workspace = true }

