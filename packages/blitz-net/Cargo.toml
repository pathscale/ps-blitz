[package]
# Published as `ps-*` because `blitz-net` on crates.io is DioxusLabs', and this
# is a fork. Keeping the upstream name meant this crate could not be published
# at all, and worse, that a dependent asking for `blitz-net` by version would
# silently get upstream's. The `[lib]` name below stays `blitz_net`, so every
# path in this workspace is unchanged.
name = "ps-blitz-net"
description = "Blitz networking"
documentation = "https://docs.rs/ps-blitz-net"
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "blitz_net"

[features]
# Enables the embedder-owned house CookieJar constructor.
cookies = []
# Advertise only the codecs decoded by the house HTTP client.
compression = ["dep:flate2", "dep:brotli"]
multipart = ["dep:psc-nanoid"]
cache = [
    "dep:worktable",
    "dep:psc-nanoid",
    "dep:httpdate",
]
tracing = ["dep:tracing"]

[dependencies]
# Blitz dependencies
blitz-traits = { workspace = true }

# Networking dependencies
data-url = { workspace = true }
bytes = { workspace = true }
url = { workspace = true }

# NET-H1 codecs, matching chuzz.
flate2 = { version = "1", optional = true }
brotli = { version = "8", default-features = false, features = ["std"], optional = true }

tracing = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nagoya = { version = "^0.1.13", features = ["reactor"] }
nago-rustls = { version = "^0.1.3", default-features = false }
rustls = { version = "^0.23.40", default-features = false, features = ["std", "tls12"] }
ps-rustcrypto = { version = "^0.4", default-features = false, features = ["std", "tls12", "zeroize"] }
# HTTP/2 codec. Only the tokio io traits are used: no tokio runtime or reactor.
h2 = "^0.4"
tokio = { version = "^1", default-features = false }
# Name checks against a pooled certificate for HTTP/2 connection coalescing.
webpki = { package = "rustls-webpki", version = "^0.103", default-features = false, features = ["std"] }
# Export native trust anchors; cryptographic verification stays in RustCrypto.
rustls-native-certs = "^0.8.4"
# The built-in public roots: CT applies only to chains ending in one.
webpki-roots = "^1"
# Required for durable metadata, house body identifiers and RFC HTTP dates.
worktable = { version = "^1.10.0-beta2", default-features = false, features = ["std", "wti-std-search"], optional = true }
psc-nanoid = { version = "^3.2", optional = true }
httpdate = { version = "^1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { workspace = true }
