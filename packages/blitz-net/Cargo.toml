[package]
# Published as `ps-*` because `blitz-net` on crates.io is DioxusLabs', and this
# is a fork. Keeping the upstream name meant this crate could not be published
# at all, and worse, that a dependent asking for `blitz-net` by version would
# silently get upstream's. The `[lib]` name below stays `blitz_net`, so every
# path in this workspace is unchanged.
name = "ps-blitz-net"
description = "Blitz networking"
documentation = "https://docs.rs/ps-blitz-net"
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "blitz_net"

[features]
http2 = ["reqwest/http2"]
cookies = ["reqwest/cookies"]
# Servers send gzip or brotli by default. reqwest only sends Accept-Encoding
# for the codecs it was built with, so without these every response arrives
# uncompressed and every page costs more bytes than it should.
compression = ["reqwest/brotli", "reqwest/gzip", "reqwest/deflate", "reqwest/zstd"]
multipart = ["reqwest/multipart", "reqwest/stream"]
cache = ["dep:reqwest-middleware", "dep:http-cache-reqwest", "dep:directories", "dep:http-cache"]
tracing = ["dep:tracing"]

[dependencies]
# Blitz dependencies
blitz-traits = { workspace = true }

# Networking dependencies
tokio = { workspace = true, features = ["sync", "time"] }
reqwest = { workspace = true, features = ["charset", "native-tls", "form"] }
data-url = { workspace = true }

# Caching
reqwest-middleware = { workspace = true, optional = true, features = ["form"]}
http-cache-reqwest = { workspace = true, optional = true, features = ["manager-cacache"] }
http-cache = { workspace = true, optional = true, features = ["url-standard"] }
directories = { workspace = true, optional = true }

tracing = { workspace = true, optional = true }

[dev-dependencies]
# `FetchProvider::fetch` hands work to `tokio::spawn`, which panics outside a
# runtime, so the tests need one. The library itself needs only `sync` and
# `time`; `rt-multi-thread` and `macros` are the test harness's.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { workspace = true, features = ["native-tls-vendored"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { workspace = true }
