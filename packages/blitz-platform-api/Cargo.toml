[package]
# Prefixed like every other published crate here; the `[lib]` below keeps the
# brief's name, so `use blitz_platform_api::` is unchanged. Unprefixed it could
# not be published, which blocked `ps-blitz-wasm` above it.
name = "ps-blitz-platform-api"
description = "Runtime-agnostic host platform APIs (fetch, storage) over blitz-traits providers"
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "blitz_platform_api"

[dependencies]
# The only dependency, and deliberately. The provider traits and the request
# and response types live here; everything else in this crate is plain Rust
# over them.
#
# In particular there is no HTTP client and no scripting engine, which is what
# `tests/no_client_or_engine.rs` asserts against the resolved graph rather than
# against this file.
blitz-traits = { workspace = true }
