[package]
name = "dom-abi"
description = "The contracts between a WebAssembly guest and a DOM host: types, enums and constants only"
version = "0.1.0"
license.workspace = true
homepage = "https://github.com/pathscale/ps-blitz"
repository = "https://github.com/pathscale/ps-blitz"
categories = ["wasm", "web-programming", "api-bindings"]
edition.workspace = true
rust-version.workspace = true

[lib]
name = "dom_abi"

# ONE dependency, and `tests/only_serde.rs` is what keeps it that way.
#
# This crate sits at the bottom of a diamond whose other three corners drag in a
# JavaScript parser, a browser engine and a wasm runtime respectively. Any of
# those arriving here would put all of them in every consumer, which is the
# whole reason the crate was split out. See README.md, "Why a third crate".
[dependencies]
serde = { workspace = true, features = ["derive"] }

# RON is the encoding, not the format (README.md). It is a dev-dependency
# because the round-trip test needs *an* encoding to round-trip through, and it
# must never reach the shipped graph: a consumer that wants CBOR or postcard
# gets it by choosing a different serde format, not by taking RON along.
# `only_serde.rs` asserts both halves of that.
[dev-dependencies]
ron = "0.12"
