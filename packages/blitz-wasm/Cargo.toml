[package]
name = "blitz-wasm"
description = "A wasmi host binding over blitz-dom-api, so a WebAssembly guest can drive the DOM"
# Not published, for the same reason as blitz-dom-api: the name is unprefixed
# while every published package in this fork carries `ps-`.
publish = false
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "blitz_wasm"

[dependencies]
# Blitz dependencies
blitz-dom-api = { workspace = true }
# The runtime-agnostic platform APIs this crate binds for a guest. Same
# relationship as `blitz-dom-api`: the logic is there, the ABI is here.
blitz-platform-api = { workspace = true }
# The shared guest/host vocabulary: status codes, id caps, and the read
# protocol. Published separately, so it is versioned in the workspace table.
dom-abi = { workspace = true }
blitz-dom = { workspace = true }
# `DomEvent` and `EventState` live here, and `blitz-dom` does not re-export
# them. `blitz-script` carries this dependency for exactly the same reason:
# both crates implement `EventHandler`, and its signature mentions both types.
blitz-traits = { workspace = true }

# The wasm interpreter. It belongs to this crate and nothing below it:
# `blitz-dom-api` must never reach a wasm runtime, and `blitz-script` must
# never reach this one.
#
# Pinned to the 1.x line, not 2.0.0-beta: `SolidRS/crates/solidrs-wasm-smoke`
# already runs a guest under wasmi 1.1.0, so this is the version with evidence
# behind it in this codebase.
wasmi = "1.1"

[dev-dependencies]
# Guests written in the text format. Already in this workspace's lockfile, so
# it costs no new crate.
#
# It earns its place by testing what a Rust guest cannot: a buffer one byte
# too small, a zero capacity, a pointer past the end of linear memory. A guest
# compiled from Rust would have to go out of its way to produce those, and they
# are exactly the cases the read protocol exists to define.
wat = "1"
# `Modifiers`, for the synthetic click. `blitz-traits` takes its event types
# from here and does not re-export this one.
keyboard-types = { workspace = true }
# The layout test measures text, so the test build needs real fonts.
#
# Without `system-fonts` parley finds no face, every line shapes to nothing,
# and every box reports a height of zero. A layout assertion then fails for a
# reason that has nothing to do with the tree the guest built, and a layout
# assertion written loosely enough to survive it would be measuring nothing.
# `blitz-script` carries the same dev-dependency for the same reason.
blitz-dom = { workspace = true, features = ["system-fonts"] }
