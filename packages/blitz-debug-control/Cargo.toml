[package]
name = "ps-blitz-debug-control"
description = "Debug-only WebDriver-style control transport for Blitz"
documentation = "https://docs.rs/ps-blitz-debug-control"
readme = "README.md"
# Its own line rather than the workspace version. This crate versions the
# loopback debug transport, which changes on its own schedule and is nowhere
# near the engine's 0.4 line; inheriting would republish it on every engine
# release and claim a compatibility break it did not make.
version = "0.3.8"
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = true
keywords = ["debugging", "testing", "blitz", "webdriver", "ui"]
categories = ["development-tools::debugging", "development-tools::testing"]
edition.workspace = true
rust-version.workspace = true

[lib]
name = "blitz_debug_control"

[dependencies]
getrandom.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
