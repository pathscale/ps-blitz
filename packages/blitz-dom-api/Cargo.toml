[package]
# Reconciled: the package is prefixed like every other published crate here and
# the `[lib]` keeps the brief's name, so `use blitz_dom_api::` is unchanged.
# Held back until now because the two could not both be `blitz-dom-api`, which
# also blocked `ps-blitz-wasm` from publishing above it.
name = "ps-blitz-dom-api"
description = "Runtime-agnostic DOM operations over blitz-dom"
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "blitz_dom_api"

[dependencies]
# Blitz dependencies
blitz-dom = { workspace = true }

# Servo dependencies
markup5ever = { workspace = true }

[dev-dependencies]
blitz-traits = { workspace = true }
