[package]
# Published as `ps-*` because `dioxus-native-dom` on crates.io is DioxusLabs',
# and theirs depends on *their* `blitz-dom 0.2.4`. Left unprefixed, publishing
# `ps-dioxus-native` resolved that one from the registry and failed with an
# `image` version conflict that named neither repository:
#
#   failed to select a version for `image`
#     ... required by package `blitz-dom v0.2.4`
#     ... which satisfies dependency `blitz-dom = "^0.2.4"` of `dioxus-native-dom v0.7.0`
#
# which is two engines arguing over a transitive dependency. `[lib]` stays
# `dioxus_native_dom`, so no path changes.
name = "ps-dioxus-native-dom"
version = "0.7.1"
authors = ["Jonathan Kelley", "Nico Burns"]
edition = "2024"
description = "Core headless native renderer for Dioxus based on blitz"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pathscale/ps-blitz"
homepage = "https://dioxuslabs.com/learn/0.7/getting_started"
keywords = ["dom", "ui", "gui", "react"]

[lib]
name = "dioxus_native_dom"

[features]
default = ["accessibility", "svg", "system-fonts"]

# DOM features
svg = ["blitz-dom/svg"]
floats = ["blitz-dom/floats"]
accessibility = ["blitz-dom/accessibility"]
tracing = ["dep:tracing", "blitz-dom/tracing"]
system-fonts = ["blitz-dom/system-fonts"]
# complex-scripts: enable dictionary-based line-breaking
complex-scripts = ["blitz-dom/complex-scripts"]
autofocus = ["blitz-dom/autofocus"]

[dependencies]
# Blitz dependencies
blitz-dom = { workspace = true, default-features = false, features = ["custom-widget"] }
blitz-traits = { workspace = true }

# DioxusLabs dependencies
dioxus-core = { workspace = true }
dioxus-html = { workspace = true }

# Windowing & Input
keyboard-types = { workspace = true }


# Other dependencies
tracing = { workspace = true, optional = true }
rustc-hash = { workspace = true }
futures-util = { workspace = true }

[dev-dependencies]
dioxus = { workspace = true }

[package.metadata.docs.rs]
all-features = true
