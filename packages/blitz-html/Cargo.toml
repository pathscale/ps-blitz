[package]
# Prefixed like the rest of the fork: `blitz-html` on crates.io is DioxusLabs'.
# This is already published as `ps-blitz-html` up to 0.3.0-beta.3, so the
# unprefixed name here also meant beta.4 could not go out under the name its own
# earlier releases used. `[lib]` stays `blitz_html`, so no path changes.
name = "ps-blitz-html"
description = "Blitz HTML parser"
documentation = "https://docs.rs/ps-blitz-html"
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "blitz_html"

[features]
accessibility = ["blitz-dom/accessibility"]
tracing = ["dep:tracing", "blitz-dom/tracing"]

[dependencies]
# Blitz dependencies
blitz-dom = { workspace = true }
blitz-traits = { workspace = true }

# Servo dependencies
html5ever = { workspace = true }
xml5ever = { workspace = true }

tracing = { workspace = true, optional = true }
