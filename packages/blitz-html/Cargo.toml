[package]
name = "blitz-html"
description = "Blitz HTML parser"
documentation = "https://docs.rs/blitz-html"
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
accessibility = ["blitz-dom/accessibility"]
tracing = ["dep:tracing", "blitz-dom/tracing"]

[dependencies]
# Blitz dependencies
blitz-dom = { workspace = true }
blitz-traits = { workspace = true }

# Servo dependencies
html5ever = { workspace = true }
xml5ever = { workspace = true }

tracing = { workspace = true, optional = true }

[dev-dependencies]
# The 22 integration tests in `tests/` need these. The replay onto upstream
# dropped this whole block, and the tests with it, so nothing has been
# guarding scrollbars, paint order, fixed positioning or SVG sizing since.
markup5ever = { workspace = true }
blitz-paint = { workspace = true, features = ["scrollbars", "svg"] }
anyrender = { workspace = true }
anyrender_vello_cpu = { workspace = true }
usvg = { workspace = true }
