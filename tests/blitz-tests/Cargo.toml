[package]
name = "blitz-tests"
description = "Integration tests for Blitz"
publish = false
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# Turns on blitz-dom's per-resolve layout counters, which `streaming_token_cost`
# reads. Off by default: the counting itself costs a `HashMap` entry per
# `compute_child_layout`, so it must not ride the default test run.
counters = ["blitz-dom/log-phase-times"]
# The rayon fan-out over deferred inline construction, for measuring against
# the sequential path it is switched off in favour of.
parallel-construct = ["blitz-dom/parallel-construct"]

[dev-dependencies]
# Blitz dependencies
blitz-test-harness = { workspace = true }
blitz-dom = { workspace = true, features = ["accessibility", "floats", "system-fonts"] }
blitz-html = { workspace = true }
blitz-traits = { workspace = true }
blitz-paint = { workspace = true, features = ["scrollbars", "svg"] }
dioxus-native-dom = { workspace = true }
anyrender = { workspace = true }
anyrender_vello_cpu = { workspace = true, features = ["filters"] }

# DioxusLabs dependencies
dioxus = { workspace = true }
dioxus-core = { workspace = true }

# Other dependencies
accesskit = { workspace = true }
cursor-icon = { workspace = true }
markup5ever = { workspace = true }
keyboard-types = { workspace = true }
usvg = { workspace = true }
taffy = { workspace = true }
image = { workspace = true, features = ["png"] }

[lib]
path = "lib.rs"
