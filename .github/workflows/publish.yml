name: Publish crates

# Select the crates for this release. Cargo reads their manifest versions
# and publishes the selected crates in dependency order.
on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Workspace crate names separated by spaces (omit versions already published)'
        required: true
        type: string
      dry_run:
        description: 'Package and verify without uploading'
        required: false
        type: boolean
        default: false


concurrency:
  group: publish-ps-blitz-dom
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish Blitz workspace crates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require master for publication
        if: '!inputs.dry_run'
        shell: bash
        run: |
          if [ "${GITHUB_REF:-}" != refs/heads/master ]; then
            echo '::error::Select the master branch to publish crates.'
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@cargo-deny
      - name: Enforce the crypto policy before publication
        run: cargo deny --all-features --config deny-crypto.toml check bans

      - name: Publish selected crates
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ !inputs.dry_run && secrets.CARGO_REGISTRY_TOKEN || '' }}
          PUBLISH_PACKAGES: ${{ inputs.packages }}
          PUBLISH_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          read -r -a packages <<< "${PUBLISH_PACKAGES//$'\n'/ }"
          if (( ${#packages[@]} == 0 )); then
            echo '::error::Select at least one workspace crate.'
            exit 1
          fi

          dry_run=()
          if [[ "$PUBLISH_DRY_RUN" == true ]]; then
            dry_run=(--dry-run)
          fi
          cargo publish --registry crates-io "${dry_run[@]}" "${packages[@]/#/--package=}"
