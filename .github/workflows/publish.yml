name: Publish crates

# A workspace version bump is the release trigger. The renderer workspace has
# many crates, but this repository currently ships the AgencyZero safety fix
# through ps-blitz-dom; publishing it alone avoids unrelated crate churn.
on:
  push:
    branches: [master]
    paths:
      - Cargo.toml
      - Cargo.lock
      - packages/blitz-dom/**
      - .github/workflows/publish.yml
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Package and verify without uploading'
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-ps-blitz-dom
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish ps-blitz-dom
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # ps-blitz-dom's system-fonts feature verifies against fontconfig on
      # Linux. Keep publishing on the same native dependency baseline as CI.
      - uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libfontconfig-dev
          version: 1.0

      - name: Check registry state
        id: registry
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          published="$(curl -sS -H 'User-Agent: pathscale-ci' \
            'https://crates.io/api/v1/crates/ps-blitz-dom/versions' \
            | jq -r --arg version "$version" \
              '.versions[]? | select(.num == $version) | .num')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$published" ]; then
            echo 'already=true' >> "$GITHUB_OUTPUT"
            echo "ps-blitz-dom $version is already published"
          else
            echo 'already=false' >> "$GITHUB_OUTPUT"
            echo "ps-blitz-dom $version is new"
          fi

      - name: Package
        if: steps.registry.outputs.already == 'false'
        run: cargo package -p ps-blitz-dom --locked

      - name: Publish
        if: steps.registry.outputs.already == 'false' && !inputs.dry_run
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo 'CARGO_REGISTRY_TOKEN is not set on this repository' >&2
            exit 1
          fi
          cargo publish -p ps-blitz-dom --locked

      - name: Summary
        if: always()
        run: |
          if [ '${{ steps.registry.outputs.already }}' = 'true' ]; then
            echo "Nothing to publish: ps-blitz-dom ${{ steps.registry.outputs.version }} already exists." \
              >> "$GITHUB_STEP_SUMMARY"
          elif [ '${{ inputs.dry_run }}' = 'true' ]; then
            echo "Dry run: packaged ps-blitz-dom ${{ steps.registry.outputs.version }}." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Published ps-blitz-dom ${{ steps.registry.outputs.version }}." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
