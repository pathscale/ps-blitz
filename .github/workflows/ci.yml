name: CI

on:
  pull_request:
  push:
    branches:
      # `master`, this fork's default branch, not upstream's `main`.
      #
      # This was inherited from DioxusLabs/blitz and never changed, so push CI
      # fired for a branch this repository does not have: every merge to
      # `master` ran nothing, and the only green push runs in the history belong
      # to upstream's `main`. Pull requests still ran, which is what hid it.
      - master
      - v0.*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUSTDOCFLAGS: "-D warnings"
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: "sparse"
  # The crates that paint on a screen. Each opts into `system-fonts`, which
  # reaches `parley/system` and, on Linux only, `yeslogic-fontconfig-sys`. That
  # is a system library, and installing it here is what made a headless runner
  # carry a GUI's dependencies: every job in this file then needed
  # `libfontconfig-dev` before it could build, and one of them shelled out to
  # `apt-get` to be sure.
  #
  # A GUI legitimately wants the machine's font catalogue, so it keeps the
  # feature and is built where a GUI is the deliverable. Everything here is
  # headless and installs nothing. `blitz-dom` and `blitz-script`, which is what
  # a headless embedder actually consumes, reach no system library at all.
  HEADLESS_EXCLUDE: >-
    --exclude ps-dioxus-native
    --exclude ps-dioxus-native-dom
    --exclude browser
    --exclude counter
    --exclude transparent
    --exclude seven_guis
    --exclude todomvc
    --exclude wgpu_texture
    --exclude wpt

jobs:

  # MSRV check.
  # Blitz only guarantees "latest stable". However we have this check here to ensure that we advertise
  # our MSRV. We also make an effort not to increase MSRV in patch versions of Blitz.
  #
  # We only run `cargo build` (not `cargo test`) so as to avoid requiring dev-dependencies to build with the MSRV
  # version. Building is likely sufficient as runtime errors varying between rust versions is very unlikely.
  build-msrv:
    name: "MSRV Build [Rust 1.91]"
    runs-on: ubicloud-standard-8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91
      # Restore the compiled dependency graph rather than rebuilding the
      # whole workspace from source on every run.
      - uses: Swatinem/rust-cache@v2
        with:
          key: "msrv-1.91"
          cache-all-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: perl -pi.bak -e 's/opt-level = 2/opt-level = 0/g' Cargo.toml
      - run: cargo build --workspace ${{ env.HEADLESS_EXCLUDE }}

  build-features-default:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: "Build [default features]"
    runs-on: ubicloud-standard-8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Restore the compiled dependency graph rather than rebuilding the
      # whole workspace from source on every run.
      - uses: Swatinem/rust-cache@v2
        with:
          key: "default-features"
          cache-all-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: perl -pi.bak -e 's/opt-level = 2/opt-level = 0/g' Cargo.toml
      - run: cargo build --workspace ${{ env.HEADLESS_EXCLUDE }}

  test-features-default:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: "Test [default features]"
    runs-on: ubicloud-standard-8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Restore the compiled dependency graph rather than rebuilding the
      # whole workspace from source on every run.
      - uses: Swatinem/rust-cache@v2
        with:
          key: "default-features"
          cache-all-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: perl -pi.bak -e 's/opt-level = 2/opt-level = 0/g' Cargo.toml
      - run: cargo test --workspace ${{ env.HEADLESS_EXCLUDE }}

  headless-graph:
    # The verifier for the rule the rest of this file assumes. Without one,
    # "nothing headless links a system library" is a property that held on the
    # day someone last checked, and `system-fonts` sat in `blitz-dom`'s defaults
    # long enough that two downstream repositories each worked around it by hand
    # rather than anyone noticing it here.
    #
    # `cargo deny`, the same tool and action ps-taffy and pays.online-backend
    # already use, rather than a shell loop over `cargo tree` output. The policy
    # is declarative in deny.toml, cargo-deny resolves the graph properly per
    # target, and there is no hand-kept crate list to fall out of date.
    #
    # Cheap: it resolves rather than builds, so a re-added default fails here in
    # seconds instead of surfacing as a missing apt package in someone else's CI.
    name: "No system libraries in the headless graph"
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check bans

  # There was a `build-counter` job here. It built a GUI example on a Linux
  # runner, so it needed `libfontconfig-dev` installed to compile, and it was
  # the last thing in this file asking a headless machine for a GUI's
  # libraries. Removed rather than kept behind an apt step: nothing in this
  # workflow installs a system package now, and that is the property worth
  # holding. Do not add one back to make a job build.
  #
  # A native GUI build is still covered, where a GUI is the deliverable and the
  # libraries are honest: `publish-browser.yml`, which brings its own. The
  # examples are also compiled for wasm below, which needs nothing installed.

  # wasm_hello is a standalone workspace; seven_guis and todomvc are workspace
  # members with a [lib] crate-type = ["cdylib"] target for wasm.
  build-wasm-examples:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: "Build wasm examples"
    runs-on: ubicloud-standard-8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      # Restore the compiled dependency graph rather than rebuilding the
      # whole workspace from source on every run.
      - uses: Swatinem/rust-cache@v2
        with:
          key: "wasm"
          cache-all-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build wasm_hello
        run: cargo build --target wasm32-unknown-unknown
        working-directory: examples/wasm_hello
      - name: Build seven_guis (wasm)
        run: cargo build -p seven_guis --lib --target wasm32-unknown-unknown --no-default-features --features hybrid
      - name: Build todomvc (wasm)
        run: cargo build -p todomvc --lib --target wasm32-unknown-unknown --no-default-features --features hybrid

  fmt:
    name: Rustfmt
    runs-on: ubicloud-standard-8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt
      # Restore the compiled dependency graph rather than rebuilding the
      # whole workspace from source on every run.
      - uses: Swatinem/rust-cache@v2
        with:
          key: "lint"
          cache-all-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubicloud-standard-8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      # Restore the compiled dependency graph rather than rebuilding the
      # whole workspace from source on every run.
      - uses: Swatinem/rust-cache@v2
        with:
          key: "lint"
          cache-all-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: perl -pi.bak -e 's/opt-level = 2/opt-level = 0/g' Cargo.toml
      - run: cargo clippy --workspace ${{ env.HEADLESS_EXCLUDE }} -- -D warnings

  # Every other job builds default features only, so code behind a feature is
  # never compiled here at all. `ps-blitz-script`'s `debug_control` module is
  # gated on `debug-control`, which AgencyZero enables through
  # `blitz-inspector` -- so 0.3.0-beta.10 shipped with two call sites that did
  # not compile, and CI was green throughout. It was found by a consumer
  # upgrading, which is the worst place to find it.
  #
  # Scoped rather than `--workspace --all-features` because the browser app
  # pulls `dav1d-sys`, which needs a system codec library this runner does not
  # have. What is left is the set whose public API the DOM's types reach into,
  # which is what this job exists to guard.
  build-all-features:
    name: "Build [all features]"
    runs-on: ubicloud-standard-8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Restore the compiled dependency graph rather than rebuilding the
      # whole workspace from source on every run.
      - uses: Swatinem/rust-cache@v2
        with:
          key: "all-features"
          cache-all-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # `--all-features` cannot be used here any more, and not for a CI reason.
      # `system-fonts` means "read the machine's font catalogue", so on Linux it
      # is by definition an opt-in to `yeslogic-fontconfig-sys`. Asking for
      # every feature therefore asks for a system library, and the only ways to
      # make that pass are to install one on a headless runner or to stop
      # checking. Neither is right; the feature is simply not in scope for a
      # headless build, so it is named as excluded rather than worked around.
      #
      # cargo-hack because plain `--all-features` has no way to leave one out,
      # and it is what ps-vello, wild and psc-nanoid already use here.
      # `--each-feature` is also stricter than what it replaces: it catches a
      # feature that fails to compile on its own, which `--all-features` hides
      # behind whatever else happened to be switched on.
      - name: install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - run: perl -pi.bak -e 's/opt-level = 2/opt-level = 0/g' Cargo.toml
      - run: >-
          cargo hack check --each-feature --exclude-features system-fonts
          -p ps-blitz-dom -p ps-blitz-html -p ps-blitz-script
          -p ps-blitz-paint -p ps-blitz-net

  doc:
    name: Documentation
    runs-on: ubicloud-standard-8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Restore the compiled dependency graph rather than rebuilding the
      # whole workspace from source on every run.
      - uses: Swatinem/rust-cache@v2
        with:
          key: "doc"
          cache-all-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo doc --workspace ${{ env.HEADLESS_EXCLUDE }}

  matrix_test:
    runs-on: ${{ matrix.platform.os }}
    env:
      RUST_CARGO_COMMAND: ${{ matrix.platform.cross == true && 'cross' || 'cargo' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Windows, macOS and iOS entries are deliberately absent: the paid
          # runners are not worth it when Linux validates the same code, and
          # Apple targets are built and tested locally on the machine this is
          # developed on. Nothing here needs a macOS runner any more.
          - {
              name: linux,
              target: x86_64-unknown-linux-gnu,
              os: ubicloud-standard-8,
              cross: false,
              command: "test",
              # `--no-fail-fast` because cargo otherwise stops at the first test
              # binary that fails, and this suite has around sixty. A run then
              # reports one broken thing, gets fixed, and reports the next: the
              # cost of finding N failures is N full CI runs, and the shape of
              # the problem stays hidden until the last one.
              args: "--all --tests --no-fail-fast",
            }
          - {
              name: android,
              target: aarch64-linux-android,
              os: ubicloud-standard-8,
              cross: true,
              command: "build",
              args: "--all",
            }
        exclude:
          - platform:
              name: ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'android' }}
              target: aarch64-linux-android
              os: ubicloud-standard-8
              cross: true
              command: build
              args: --all

    name: Test (${{ matrix.platform.name }})

    steps:
      - uses: actions/checkout@v4
      - name: install stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          # wasm32 as well as the platform target: `blitz-wasm`'s end-to-end
          # test builds a real guest module and instantiates it under wasmi,
          # because compiling to wasm32 only proves the code type-checks while
          # instantiating proves it links. Without the target installed the
          # test cannot run, and a test that skips when its prerequisite is
          # missing reports "no problem" and "not checked" identically.
          targets: ${{ matrix.platform.target }},wasm32-unknown-unknown
          components: rustfmt

      # Install cross from source. Because latest release doesn't work with recent Rust
      # when targeting Android. See https://github.com/cross-rs/cross/issues/1222
      - name: Install cross
        if: ${{ matrix.platform.cross == true }}
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 426e811

      - name: Free Disk Space (Ubuntu)
        if: ${{ matrix.platform.os == 'ubuntu-24.04' || matrix.platform.os == 'ubuntu-24.04-arm' }}
        uses: jlumbroso/free-disk-space@v1.3.1
        with: # speed things up a bit
          android: ${{ matrix.platform.target != 'aarch64-linux-android' }}
          large-packages: false
          swap-storage: false

      # `save-if` was `refs/heads/main`. This repository's default branch is
      # `master`, so the condition never held: nothing ever wrote a cache, and
      # every run was a guaranteed miss against one that did not exist. The
      # step looked like caching and did none.
      - uses: Swatinem/rust-cache@v2
        with:
          key: "${{ matrix.platform.target }}"
          cache-all-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-bin: ${{ matrix.platform.os != 'macos-latest' }} # works around https://github.com/Swatinem/rust-cache/issues/341

      - name: Setup
        run: ${{ matrix.platform.setup }} 
        shell: bash

      # Every entry in this matrix passes `--all`, so each one selects the GUI
      # crates too and would need a font catalogue installed to build them.
      # Same exclude list the other jobs use, applied in one place rather than
      # repeated in three matrix entries.
      - name: test
        run: |
          ${{ env.RUST_CARGO_COMMAND }} ${{ matrix.platform.command }} ${{ matrix.platform.args }} ${{ env.HEADLESS_EXCLUDE }} --target ${{ matrix.platform.target }}

  debug_control_e2e:
    name: Debug control (Solid 2 process)
    runs-on: ubicloud-standard-8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          key: "debug-control-e2e"
          cache-all-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build the matching Solid 2 fixture without a lockfile
        working-directory: examples/solid
        run: |
          bun install --no-save
          bun run build
      - name: Drive the fixture through the real process boundary
        run: cargo test -p ps-blitz-script --features debug-control --test debug_control
      # Activation behaviour, driven by ps-qa against this checkout.
      #
      # The host is built here rather than installed: `qa-inspect-host` depends
      # on the published engine, so an installed one judges the last release and
      # a change in this workspace could not fail it. `ps-qa` itself carries no
      # engine, so the published binary drives whatever host it is given.
      - uses: actions/checkout@v5
        with:
          repository: pathscale/ps-observability
          path: .ps-observability
      # The host moved. `qa-inspect-host` lived in ps-observability and was
      # deleted there in "refactor: delete qa-inspect-host, so there is one
      # headless browser"; `chuzz-headless` replaced it, and it lives here.
      - uses: actions/checkout@v5
        with:
          repository: pathscale/chuzz
          path: .chuzz
      # ps-qa from the ps-observability checkout, rather than `cargo install
      # ps-qa`. The harness and the fixtures move together, and installing it
      # while building the host would make this job depend on a release of the
      # harness as well as on the checkout, so a change to either would have to
      # be published before it could be used here.
      - name: Drive the fixtures with ps-qa
        env:
          PS_OBSERVABILITY: .ps-observability
          CHUZZ: .chuzz
          QA_BUILD_PS_QA: "1"
        run: tests/qa/run.sh
